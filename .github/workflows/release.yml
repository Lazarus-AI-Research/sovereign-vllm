name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/lazarus-ai-research
  LLAMA_VERSION: b9960
  LLAMA_SHA256: 7a8c6b6ae3395e15b5cc330ed2938cc0aa4510905db1189658fd022035734b48
  # stable-diffusion.cpp serves image deployments; its Metal build ships
  # beside llama-server in the Metal distribution.
  SD_VERSION: master-872-cc515a0
  SD_ASSET: sd-master-cc515a0-bin-Darwin-macOS-26.6.2-arm64.zip
  SD_SHA256: 39412a6abb2f19a18524903ccaa63ebbd21e4818540ce4a1d64ea5e55f474b6d
  UV_VERSION: 0.11.28
  PYTHON_VERSION: 3.12.11

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Require exact release version
        run: |
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
          python3 - <<'PY'
          import os
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v").replace("-rc.", "rc")
          with open("pyproject.toml", "rb") as handle:
              package = tomllib.load(handle)["project"]["version"]
          assert package == tag, (package, tag)
          PY
      - name: Locked package and tests
        run: |
          bash -n agent-dist/*.sh
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --format requirements.txt --no-annotate --no-header --output-file exported-requirements.lock
          cmp requirements-agent.lock exported-requirements.lock
          uv run --extra dev ruff check lazarus tests
          uv run --extra dev pytest -q
          uv build --wheel

  images:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - profile: cuda-x86_64
            platform: linux/amd64
            dockerfile: docker/cuda/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/sovereign-runtime:${{ matrix.profile }}-${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
      - name: Sign runtime image
        run: cosign sign --yes "${REGISTRY}/sovereign-runtime:${{ matrix.profile }}-${VERSION}@${{ steps.build.outputs.digest }}"

  metal-agent:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build self-contained distribution
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --format requirements.txt --no-annotate --no-header --output-file exported-requirements.lock
          cmp requirements-agent.lock exported-requirements.lock
          uv build --wheel
          mkdir -p stage/bin stage/python stage/wheels stage/agent-dist
          cp "$(command -v uv)" stage/bin/uv
          uv python install "$PYTHON_VERSION" --install-dir stage/python-install
          PYTHON="$(find stage/python-install -type f -path '*/bin/python3.12' -print -quit)"
          test -x "$PYTHON"
          cp -R "$(cd "$(dirname "$PYTHON")/.." && pwd)"/. stage/python/
          "$PYTHON" -m pip download --require-hashes --only-binary=:all: --dest stage/wheels --requirement requirements-agent.lock
          cp dist/*.whl stage/wheels/
          cp -R agent-dist/. stage/agent-dist/
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md stage/
          curl -fL -o llama.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_VERSION/llama-$LLAMA_VERSION-bin-macos-arm64.tar.gz"
          echo "$LLAMA_SHA256  llama.tar.gz" | shasum -a 256 -c -
          tar -xzf llama.tar.gz
          LLAMA="$(find . -type f -name llama-server -perm -111 -print -quit)"
          LLAMA_DIR="$(dirname "$LLAMA")"
          cp "$LLAMA" stage/bin/llama-server
          cp -pPR "$LLAMA_DIR"/*.dylib stage/bin/
          test -n "$(find stage/bin -maxdepth 1 -name '*.dylib' -print -quit)"
          curl -fL -o sd.zip "https://github.com/leejet/stable-diffusion.cpp/releases/download/$SD_VERSION/$SD_ASSET"
          echo "$SD_SHA256  sd.zip" | shasum -a 256 -c -
          mkdir -p sdcpp && unzip -q sd.zip -d sdcpp
          SD="$(find sdcpp -type f -name sd-server -perm -111 -print -quit)"
          test -n "$SD"
          cp "$SD" stage/bin/sd-server
          cp -pPR "$(dirname "$SD")"/libstable-diffusion.dylib stage/bin/
          TEST_HOME="$(mktemp -d)"
          HOME="$TEST_HOME" SOVEREIGN_AGENT_HOME="$TEST_HOME/.sovereign" SOVEREIGN_SKIP_AGENT_START=1 \
            stage/agent-dist/install-agent.sh
          "$TEST_HOME/.sovereign/runtime/venv/bin/python" -c \
            'import fastapi, lazarus.agent.server, yaml'
          "$TEST_HOME/.sovereign/runtime/bin/llama-server" --version
          "$TEST_HOME/.sovereign/runtime/bin/sd-server" -h >/dev/null
          grep -q "^sd_server: $TEST_HOME/.sovereign/runtime/bin/sd-server" "$TEST_HOME/.sovereign/agent.yaml"
          # An agent.yaml from before image deployments gains the image server
          # at upgrade and keeps everything else.
          printf 'listen: 127.0.0.1\nport: 9100\ndeployments: {}\n' > "$TEST_HOME/.sovereign/agent.yaml"
          HOME="$TEST_HOME" SOVEREIGN_AGENT_HOME="$TEST_HOME/.sovereign" SOVEREIGN_SKIP_AGENT_START=1 \
            stage/agent-dist/install-agent.sh
          grep -q "^sd_server: $TEST_HOME/.sovereign/runtime/bin/sd-server" "$TEST_HOME/.sovereign/agent.yaml"
          grep -q "^port: 9100" "$TEST_HOME/.sovereign/agent.yaml"
          rm -rf "$TEST_HOME"
          tar -C stage -czf "sovereign-metal-agent-$VERSION-arm64.tar.gz" .
          shasum -a 256 "sovereign-metal-agent-$VERSION-arm64.tar.gz" > "sovereign-metal-agent-$VERSION-arm64.tar.gz.sha256"
      - name: Generate Metal distribution SBOM
        uses: anchore/sbom-action@v0
        with:
          path: stage
          output-file: sovereign-metal-agent.spdx.json
          format: spdx-json
      - uses: sigstore/cosign-installer@v3
      - name: Sign Metal distribution
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="sovereign-metal-agent-$VERSION-arm64.tar.gz"
          mv sovereign-metal-agent.spdx.json "sovereign-metal-agent-$VERSION-arm64.spdx.json"
          cosign sign-blob --yes --bundle "$ARCHIVE.sigstore.json" "$ARCHIVE"
      # Published with the GitHub CLI rather than a Node action: the action,
      # forced onto Node 24 by the runner, failed the archive's upload three
      # times in a row while the small files went through.
      - name: Publish the Metal distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            PRERELEASE=""
            case "$GITHUB_REF_NAME" in *-rc.*) PRERELEASE="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" $PRERELEASE --generate-notes --title "$GITHUB_REF_NAME"
          fi
          for attempt in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" --clobber \
                "sovereign-metal-agent-$VERSION-arm64.tar.gz" \
                "sovereign-metal-agent-$VERSION-arm64.tar.gz.sha256" \
                "sovereign-metal-agent-$VERSION-arm64.tar.gz.sigstore.json" \
                "sovereign-metal-agent-$VERSION-arm64.spdx.json"; then
              exit 0
            fi
            echo "upload attempt $attempt failed; retrying" >&2
            sleep 15
          done
          exit 1
